blueprint:
  name: Apollo Automation PLT-1 Blueprint
  source_url: https://github.com/ApolloAutomation/Blueprints/blob/main/PLT-1/PLT-1.yaml
  author: Brandon Harvey aka Smart Home Sellout
  description: >
    🌱 Receive mobile alerts when your Apollo Automation PLT-1 detects low soil
    moisture and more!

    🪴 Works with both the [PLT-1
    (wired)](https://wiki.apolloautomation.com/products/plt1/introduction/) and
    [PLT-1B
    (battery)](https://wiki.apolloautomation.com/products/plt1b/introduction/)
    models.

    ⚠️ **Calibration required** — your sensor must be calibrated before soil
    moisture readings are accurate. See the [calibration
    guide](https://wiki.apolloautomation.com/products/general/calibrating-and-updating/calibrate-plt1).

    **Setup:**

    0️⃣ Calibrate your sensor — enable the Soil ADC entity on your device,
    record the dry and wet voltage readings, then disable Soil ADC again

    1️⃣ Select your PLT-1 or PLT-1B device

    2️⃣ Enter your plant's name

    3️⃣ Configure your notification device and options

    4️⃣ Enter your calibration voltages in the Calibration section

    5️⃣ Enable each sensor group you want to monitor and adjust thresholds

    6️⃣ (Optional) Turn on the RGB LED indicator so the onboard LED lights up
    when the plant needs water
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:

    # ── Device ─────────────────────────────────────────────────────────────────
    device_id:
      name: PLT-1 Device
      description: Select your Apollo Automation PLT-1 or PLT-1B plant sensor.
      selector:
        device:
          filter:
            - integration: esphome
              manufacturer: ApolloAutomation
              model: PLT-1
            - integration: esphome
              manufacturer: ApolloAutomation
              model: PLT-1_Minimal
            - integration: esphome
              manufacturer: ApolloAutomation
              model: PLT-1BLE
            - integration: esphome
              manufacturer: ApolloAutomation
              model: PLT-1B
            - integration: esphome
              manufacturer: ApolloAutomation
              model: PLT-1B_Minimal
            - integration: esphome
              manufacturer: ApolloAutomation
              model: PLT-1BBLE
          multiple: false

    plant_name:
      name: Plant Name
      description: Name of your plant. Used to personalise alert messages.
      default: "My Plant"
      selector:
        text:

    # ── Notification Device ─────────────────────────────────────────────────────
    notify_device:
      name: Notify Device
      description: >
        Select the mobile device to send push notifications to (requires the
        Home Assistant Companion App). Leave blank to use only the Custom Action
        below.
      default: ""
      selector:
        device:
          integration: mobile_app
          multiple: false

    # ── Notification Options (collapsed) ────────────────────────────────────────
    notify_options:
      name: Notification Options
      icon: mdi:bell-cog
      collapsed: true
      input:
        notify_interruption_level:
          name: Interruption Level — iOS Only
          description: >
            On iOS 15+ you can set how urgently notifications interrupt you.
            Critical and Time-Sensitive notifications require them to be enabled
            in the Home Assistant App.
            [More info](https://community.home-assistant.io/t/653754/192?u=blacky)
          default: active
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: "active"
                - label: Critical Notifications
                  value: "critical"
                - label: Time Sensitive Notifications
                  value: "time-sensitive"
                - label: Quiet — No Screen Wake
                  value: "passive"

        notify_data:
          name: Android Options (Optional)
          description: >
            **High Priority** bypasses delivery delays for instant alerts.
            **Sticky Notification** keeps the alert visible until manually dismissed.
            **Notification Channel** lets you customise sound and vibration per channel.
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: High Priority
                  value: "high_priority"
                - label: Sticky Notification
                  value: "sticky"
                - label: Notification Channel
                  value: "channel"

        notify_channel:
          name: Android Notification Channel (Optional)
          description: Channel name when "Notification Channel" is selected above.
          default: ""
          selector:
            text:

    # ── Custom Action (collapsed) ────────────────────────────────────────────────
    custom_action_settings:
      name: Custom Action
      icon: mdi:lightning-bolt
      collapsed: true
      input:
        custom_action:
          name: Custom Action (Optional)
          description: >
            Run any additional action whenever an alert fires — TTS announcement,
            light flash, email, or any other notification service.
          default: []
          selector:
            action:

    # ── RGB LED Indicator (collapsed) ────────────────────────────────────────────
    led_settings:
      name: RGB LED Indicator
      icon: mdi:led-on
      collapsed: true
      description: >
        Light up the onboard RGB LED when soil moisture drops below your
        minimum, so you can see that the plant needs water without checking
        your phone.
      input:
        led_mode:
          name: LED Mode
          description: >
            **Off**: the blueprint leaves the LED alone.

            **Flash On Alert**: the LED lights up for a few seconds each time a
            low moisture alert fires, then turns itself off. Use this if you
            have turned Prevent Sleep off to extend battery life.

            **Stay On Until Watered**: the LED stays lit until soil moisture
            climbs back above your minimum. Both the PLT-1 and the PLT-1B ship
            with Prevent Sleep turned on, so this works out of the box on
            either model. If you turn Prevent Sleep off, the firmware switches
            the LED off every time the device sleeps, and it only relights
            while the device is awake.
          default: "off"
          selector:
            select:
              mode: dropdown
              options:
                - label: "Off"
                  value: "off"
                - label: "Flash On Alert"
                  value: "flash"
                - label: "Stay On Until Watered"
                  value: "hold"

        led_color:
          name: LED Color
          description: Color the LED shows when the plant needs water.
          default: [0, 120, 255]
          selector:
            color_rgb:

        led_brightness:
          name: LED Brightness
          description: Brightness of the LED while the alert is showing.
          default: 60
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              step: 1
              mode: slider

        led_effect:
          name: LED Effect
          description: >
            A pulsing LED is easier to spot across a room than a solid one.
            Slow Pulse and Fast Pulse are built into the PLT-1 firmware.
          default: "Slow Pulse"
          selector:
            select:
              mode: dropdown
              options:
                - label: "Solid"
                  value: "None"
                - label: "Slow Pulse"
                  value: "Slow Pulse"
                - label: "Fast Pulse"
                  value: "Fast Pulse"

        led_flash_duration:
          name: Flash Duration (seconds)
          description: >
            How long the LED stays lit in Flash On Alert mode. Ignored by the
            other modes.
          default: 10
          selector:
            number:
              min: 1
              max: 120
              unit_of_measurement: seconds
              step: 1
              mode: box

    # ── Repeat / Timing (collapsed) ──────────────────────────────────────────────
    time_settings:
      name: Repeat Alerts
      collapsed: true
      description: >
        Set a repeating schedule to re-send reminders while a condition persists.
        Alerts also fire immediately when a threshold is first crossed.
      icon: mdi:clock-alert
      input:
        disable_repeat:
          name: Disable Repeat Alerts
          description: >
            When enabled, alerts fire only once per threshold crossing and
            are never re-sent on a schedule.
          default: false
          selector:
            boolean:

        time_hours:
          name: Repeat — Hours
          description: How often (by hour) to re-send alerts when conditions persist.
          default: "*"
          selector:
            select:
              mode: dropdown
              options:
                - label: "Every Hour"
                  value: "*"
                - label: "Every 2 Hours"
                  value: "/2"
                - label: "Every 4 Hours"
                  value: "/4"
                - label: "Every 6 Hours"
                  value: "/6"
                - label: "Every 12 Hours"
                  value: "/12"

        time_minutes:
          name: Repeat — Minutes
          description: Minute offset for the repeat schedule.
          default: "1"
          selector:
            select:
              mode: dropdown
              options:
                - label: "At :01"
                  value: "1"
                - label: "Every 5 Minutes"
                  value: "/5"
                - label: "Every 10 Minutes"
                  value: "/10"
                - label: "Every 15 Minutes"
                  value: "/15"
                - label: "Every 30 Minutes"
                  value: "/30"

    # ── Calibration ───────────────────────────────────────────────────────────────
    calibration_settings:
      name: Calibration
      collapsed: true
      description: >
        Set the dry and wet calibration voltages for your soil moisture sensor.
        To get these values: temporarily enable the Soil ADC diagnostic entity
        on your device (Settings → Devices & Services → your PLT-1 → enable
        Soil ADC), record the raw voltage with the probe dry in air, then
        again with the probe submerged in water up to the Apollo label only.
        Disable Soil ADC again when done.
      icon: mdi:tune-variant
      input:
        dry_voltage_value:
          name: Dry Voltage (V)
          description: >
            ADC voltage reading with probe dry in air. Default is 2.77 V —
            update this after reading your Soil ADC entity.
          default: 2.77
          selector:
            number:
              min: 0.0
              max: 3.3
              step: 0.01
              unit_of_measurement: V
              mode: box

        wet_voltage_value:
          name: Wet Voltage (V)
          description: >
            ADC voltage reading with probe submerged in water up to the Apollo
            label. Do not submerge further. Default is 1.47 V.
          default: 1.47
          selector:
            number:
              min: 0.0
              max: 3.3
              step: 0.01
              unit_of_measurement: V
              mode: box

    # ── Soil Moisture (collapsed) ─────────────────────────────────────────────────
    soil_moisture_settings:
      name: Soil Moisture
      icon: mdi:water-percent
      collapsed: true
      input:
        soil_moisture_enabled:
          name: Enable Soil Moisture Alerts
          default: true
          selector:
            boolean:

        min_soil_moisture:
          name: Minimum Soil Moisture (%)
          description: Alert when moisture drops below this level — plant may need watering.
          default: 20
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              step: 1
              mode: slider

        max_soil_moisture:
          name: Maximum Soil Moisture (%)
          description: Alert when moisture rises above this level — risk of overwatering.
          default: 80
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              step: 1
              mode: slider

    # ── Soil Temperature (collapsed) ──────────────────────────────────────────────
    soil_temp_settings:
      name: Soil Temperature
      icon: mdi:thermometer
      collapsed: true
      input:
        soil_temp_enabled:
          name: Enable Soil Temperature Alerts
          default: false
          selector:
            boolean:

        min_soil_temp:
          name: Minimum Soil Temperature
          description: >
            Alert when soil temperature drops below this value — roots may be
            too cold. Use the unit your sensor shows in Home Assistant.
            10 °C / 50 °F is a good starting point.
          default: 10
          selector:
            number:
              min: -20
              max: 130
              step: 0.5

        max_soil_temp:
          name: Maximum Soil Temperature
          description: >
            Alert when soil temperature rises above this value — roots may
            overheat. Use the unit your sensor shows in Home Assistant.
            30 °C / 86 °F is a good starting point.
          default: 30
          selector:
            number:
              min: -20
              max: 130
              step: 0.5

    # ── Air Temperature (collapsed) ────────────────────────────────────────────────
    air_temp_settings:
      name: Air Temperature
      icon: mdi:home-thermometer
      collapsed: true
      input:
        air_temp_enabled:
          name: Enable Air Temperature Alerts
          default: false
          selector:
            boolean:

        min_air_temp:
          name: Minimum Air Temperature
          description: >
            Alert when ambient temperature drops below this value. Use the
            unit your sensor shows in Home Assistant. 15 °C / 59 °F is a good
            starting point.
          default: 15
          selector:
            number:
              min: -20
              max: 130
              step: 0.5

        max_air_temp:
          name: Maximum Air Temperature
          description: >
            Alert when ambient temperature rises above this value. Use the
            unit your sensor shows in Home Assistant. 32 °C / 90 °F is a good
            starting point.
          default: 32
          selector:
            number:
              min: -20
              max: 130
              step: 0.5

    # ── Air Humidity (collapsed) ───────────────────────────────────────────────────
    air_humidity_settings:
      name: Air Humidity
      icon: mdi:water-percent
      collapsed: true
      input:
        air_humidity_enabled:
          name: Enable Air Humidity Alerts
          default: false
          selector:
            boolean:

        min_air_humidity:
          name: Minimum Air Humidity (%)
          description: Alert when humidity drops below this level — dry air stresses plants.
          default: 30
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              step: 1
              mode: slider

        max_air_humidity:
          name: Maximum Air Humidity (%)
          description: Alert when humidity rises above this level — risk of mold or rot.
          default: 80
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              step: 1
              mode: slider

    # ── Light Intensity (collapsed) ────────────────────────────────────────────────
    light_settings:
      name: Light Intensity
      icon: mdi:weather-sunny
      collapsed: true
      input:
        light_enabled:
          name: Enable Light Intensity Alerts
          default: false
          selector:
            boolean:

        min_light:
          name: Minimum Light (lux)
          description: Alert when light drops below this level — too dark for healthy growth.
          default: 100
          selector:
            number:
              min: 0
              max: 100000
              unit_of_measurement: "lux"
              step: 10

        max_light:
          name: Maximum Light (lux)
          description: Alert when light rises above this level — too bright or direct sun.
          default: 50000
          selector:
            number:
              min: 0
              max: 200000
              unit_of_measurement: "lux"
              step: 100

    # ── UV Index (collapsed) ──────────────────────────────────────────────────────
    uv_settings:
      name: UV Index
      icon: mdi:sun-wireless
      collapsed: true
      input:
        uv_enabled:
          name: Enable UV Index Alerts
          default: false
          selector:
            boolean:

        max_uv:
          name: Maximum UV Index
          description: Alert when UV index rises above this level — excessive UV exposure.
          default: 6
          selector:
            number:
              min: 0
              max: 11
              unit_of_measurement: "UV index"
              step: 1

    # ── Battery (PLT-1B only, collapsed) ──────────────────────────────────────────
    battery_settings:
      name: Battery (PLT-1B only)
      icon: mdi:battery-alert
      collapsed: true
      input:
        battery_enabled:
          name: Enable Battery Alerts (PLT-1B only)
          description: Only applies to battery-powered PLT-1B models — has no effect on wired PLT-1 devices.
          default: false
          selector:
            boolean:

        min_battery:
          name: Minimum Battery Level (%)
          description: Alert when battery drops below this percentage.
          default: 20
          selector:
            number:
              min: 5
              max: 50
              unit_of_measurement: "%"
              step: 5
              mode: slider


# ── Trigger Variables ────────────────────────────────────────────────────────────
trigger_variables:

  # Device and entity discovery
  device_id: !input device_id
  plant_name: !input plant_name
  entities: >-
    {{ device_entities(device_id) | select('search', '^sensor\.') | list }}

  soil_moisture_entity: >-
    {{ entities | select('search', 'soil_moisture') | reject('search', 'adc') | list | first | default('') }}
  soil_temp_entity: >-
    {{ entities | select('search', 'soil_temperature') | list | first | default('') }}
  air_temp_entity: >-
    {{ entities | select('search', 'air_temperature') | list | first | default('') }}
  air_humidity_entity: >-
    {{ entities | select('search', 'air_humidity') | list | first | default('') }}
  light_entity: >-
    {{ entities | select('search', 'ltr390_light') | list | first | default('') }}
  uv_entity: >-
    {{ entities | select('search', 'ltr390_uv_index') | list | first | default('') }}
  battery_entity: >-
    {{ entities | select('search', 'battery_level') | list | first | default('') }}
  rgb_light_entity: >-
    {{ device_entities(device_id) | select('match', 'light\..*') | list | first | default('') }}

  # Enable flags
  soil_moisture_enabled: !input soil_moisture_enabled
  soil_temp_enabled: !input soil_temp_enabled
  air_temp_enabled: !input air_temp_enabled
  air_humidity_enabled: !input air_humidity_enabled
  light_enabled: !input light_enabled
  uv_enabled: !input uv_enabled
  battery_enabled: !input battery_enabled

  # Thresholds
  min_soil_moisture: !input min_soil_moisture
  max_soil_moisture: !input max_soil_moisture
  min_soil_temp: !input min_soil_temp
  max_soil_temp: !input max_soil_temp
  min_air_temp: !input min_air_temp
  max_air_temp: !input max_air_temp
  min_air_humidity: !input min_air_humidity
  max_air_humidity: !input max_air_humidity
  min_light: !input min_light
  max_light: !input max_light
  max_uv: !input max_uv
  min_battery: !input min_battery

  # RGB LED
  led_mode: !input led_mode
  led_color: !input led_color
  led_brightness: !input led_brightness
  led_effect: !input led_effect
  led_flash_duration: !input led_flash_duration

  # Notification
  notify_device: !input notify_device
  notify_interruption_level: !input notify_interruption_level
  notify_data: !input notify_data
  notify_channel: !input notify_channel
  device_message_data: >-
    {% set message = namespace(data={}) %}
    {% set push = namespace(data={}) %}
    {% if notify_interruption_level in ['active', 'critical', 'time-sensitive', 'passive'] %}
      {% set push.data = dict(push.data, **{ 'interruption-level': notify_interruption_level }) %}
    {% endif %}
    {% if push.data %}
      {% set message.data = dict(message.data, **{ 'push': push.data }) %}
    {% endif %}
    {% if 'high_priority' in notify_data %}
      {% set message.data = dict(message.data, **{ 'ttl': 0, 'priority': 'high' }) %}
    {% endif %}
    {% if 'sticky' in notify_data %}
      {% set message.data = dict(message.data, **{ 'sticky': true }) %}
    {% endif %}
    {% if 'channel' in notify_data and notify_channel != '' %}
      {% set message.data = dict(message.data, **{ 'channel': notify_channel }) %}
    {% endif %}
    {% set message.data = dict(message.data, **{ 'tag': 'apollo-plt1-' ~ device_id }) %}
    {{ message.data }}

  time_hours: !input time_hours
  disable_repeat: !input disable_repeat

  dry_voltage_entity: >-
    {{ device_entities(device_id) | select('match', 'number\..*dry_voltage.*') | list | first | default('') }}
  wet_voltage_entity: >-
    {{ device_entities(device_id) | select('match', 'number\..*wet_voltage.*|number\..*100_water.*') | list | first | default('') }}
  dry_voltage_value: !input dry_voltage_value
  wet_voltage_value: !input wet_voltage_value

# ── Per-Run Variables ──────────────────────────────────────────────────────────────
# Rendered fresh on every run. trigger_variables also render once at automation
# load with limited templates, where states() is unavailable, so the live
# sensor reads live here instead. Each breached threshold contributes one
# entry pairing its alert title with its full message line, worded exactly
# like the per-sensor notifications this blueprint used to send.
variables:
  breaches: >-
    {% set b = namespace(items=[]) %}
    {% if soil_moisture_enabled and soil_moisture_entity != ''
          and is_number(states(soil_moisture_entity))
          and states(soil_moisture_entity) | float < min_soil_moisture %}
      {% set b.items = b.items + [{'title': 'Soil Moisture Low',
         'message': 'Soil moisture is ' ~ (states(soil_moisture_entity) | float(0) | round(1))
           ~ '%, below the minimum of ' ~ min_soil_moisture ~ '%. Time to water!'}] %}
    {% endif %}
    {% if soil_moisture_enabled and soil_moisture_entity != ''
          and is_number(states(soil_moisture_entity))
          and states(soil_moisture_entity) | float > max_soil_moisture %}
      {% set b.items = b.items + [{'title': 'Soil Moisture High',
         'message': 'Soil moisture is ' ~ (states(soil_moisture_entity) | float(0) | round(1))
           ~ '%, above the maximum of ' ~ max_soil_moisture ~ '%. Risk of overwatering!'}] %}
    {% endif %}
    {% if soil_temp_enabled and soil_temp_entity != ''
          and is_number(states(soil_temp_entity))
          and states(soil_temp_entity) | float < min_soil_temp %}
      {% set b.items = b.items + [{'title': 'Soil Too Cold',
         'message': 'Soil temperature is ' ~ (states(soil_temp_entity) | float(0) | round(1))
           ~ state_attr(soil_temp_entity, 'unit_of_measurement')
           ~ ', below the minimum of ' ~ min_soil_temp
           ~ state_attr(soil_temp_entity, 'unit_of_measurement')
           ~ '. Roots may be too cold!'}] %}
    {% endif %}
    {% if soil_temp_enabled and soil_temp_entity != ''
          and is_number(states(soil_temp_entity))
          and states(soil_temp_entity) | float > max_soil_temp %}
      {% set b.items = b.items + [{'title': 'Soil Too Hot',
         'message': 'Soil temperature is ' ~ (states(soil_temp_entity) | float(0) | round(1))
           ~ state_attr(soil_temp_entity, 'unit_of_measurement')
           ~ ', above the maximum of ' ~ max_soil_temp
           ~ state_attr(soil_temp_entity, 'unit_of_measurement')
           ~ '. Roots may overheat!'}] %}
    {% endif %}
    {% if air_temp_enabled and air_temp_entity != ''
          and is_number(states(air_temp_entity))
          and states(air_temp_entity) | float < min_air_temp %}
      {% set b.items = b.items + [{'title': 'Air Too Cold',
         'message': 'Air temperature is ' ~ (states(air_temp_entity) | float(0) | round(1))
           ~ state_attr(air_temp_entity, 'unit_of_measurement')
           ~ ', below the minimum of ' ~ min_air_temp
           ~ state_attr(air_temp_entity, 'unit_of_measurement')
           ~ '. Environment may be too cold!'}] %}
    {% endif %}
    {% if air_temp_enabled and air_temp_entity != ''
          and is_number(states(air_temp_entity))
          and states(air_temp_entity) | float > max_air_temp %}
      {% set b.items = b.items + [{'title': 'Air Too Hot',
         'message': 'Air temperature is ' ~ (states(air_temp_entity) | float(0) | round(1))
           ~ state_attr(air_temp_entity, 'unit_of_measurement')
           ~ ', above the maximum of ' ~ max_air_temp
           ~ state_attr(air_temp_entity, 'unit_of_measurement')
           ~ '. Environment may be too hot!'}] %}
    {% endif %}
    {% if air_humidity_enabled and air_humidity_entity != ''
          and is_number(states(air_humidity_entity))
          and states(air_humidity_entity) | float < min_air_humidity %}
      {% set b.items = b.items + [{'title': 'Air Too Dry',
         'message': 'Air humidity is ' ~ (states(air_humidity_entity) | float(0) | round(1))
           ~ '%, below the minimum of ' ~ min_air_humidity
           ~ '%. Dry air can stress your plant!'}] %}
    {% endif %}
    {% if air_humidity_enabled and air_humidity_entity != ''
          and is_number(states(air_humidity_entity))
          and states(air_humidity_entity) | float > max_air_humidity %}
      {% set b.items = b.items + [{'title': 'Humidity Too High',
         'message': 'Air humidity is ' ~ (states(air_humidity_entity) | float(0) | round(1))
           ~ '%, above the maximum of ' ~ max_air_humidity
           ~ '%. Risk of mold or rot!'}] %}
    {% endif %}
    {% if light_enabled and light_entity != ''
          and is_number(states(light_entity))
          and states(light_entity) | float < min_light %}
      {% set b.items = b.items + [{'title': 'Not Enough Light',
         'message': 'Light level is ' ~ (states(light_entity) | float(0) | round(0))
           ~ ' lux, below the minimum of ' ~ min_light
           ~ ' lux. Move to a brighter spot!'}] %}
    {% endif %}
    {% if light_enabled and light_entity != ''
          and is_number(states(light_entity))
          and states(light_entity) | float > max_light %}
      {% set b.items = b.items + [{'title': 'Too Much Light',
         'message': 'Light level is ' ~ (states(light_entity) | float(0) | round(0))
           ~ ' lux, above the maximum of ' ~ max_light
           ~ ' lux. Direct sun may scorch leaves!'}] %}
    {% endif %}
    {% if uv_enabled and uv_entity != ''
          and is_number(states(uv_entity))
          and states(uv_entity) | float > max_uv %}
      {% set b.items = b.items + [{'title': 'UV Index High',
         'message': 'UV index is ' ~ (states(uv_entity) | float(0) | round(1))
           ~ ', above the maximum of ' ~ max_uv
           ~ '. Excessive UV exposure!'}] %}
    {% endif %}
    {% if battery_enabled and battery_entity != ''
          and is_number(states(battery_entity))
          and states(battery_entity) | float < min_battery %}
      {% set b.items = b.items + [{'title': 'Sensor Battery Low',
         'message': 'Sensor battery is ' ~ (states(battery_entity) | float(0) | round(0))
           ~ '%, below the minimum of ' ~ min_battery
           ~ '%. Please recharge!'}] %}
    {% endif %}
    {{ b.items }}

# ── Triggers ─────────────────────────────────────────────────────────────────────
triggers:
  # Repeat / reminder schedule
  - trigger: time_pattern
    hours: !input time_hours
    minutes: !input time_minutes
    id: time

  # Soil moisture
  - trigger: template
    value_template: >-
      {{ soil_moisture_enabled and soil_moisture_entity != ''
         and is_number(states(soil_moisture_entity))
         and states(soil_moisture_entity) | float < min_soil_moisture }}
    id: soil_moisture_min

  - trigger: template
    value_template: >-
      {{ soil_moisture_enabled and soil_moisture_entity != ''
         and is_number(states(soil_moisture_entity))
         and states(soil_moisture_entity) | float > max_soil_moisture }}
    id: soil_moisture_max

  - trigger: template
    value_template: >-
      {{ led_mode == 'hold' and soil_moisture_enabled and soil_moisture_entity != ''
         and is_number(states(soil_moisture_entity))
         and states(soil_moisture_entity) | float >= min_soil_moisture }}
    id: soil_moisture_ok

  # Soil temperature
  - trigger: template
    value_template: >-
      {{ soil_temp_enabled and soil_temp_entity != ''
         and is_number(states(soil_temp_entity))
         and states(soil_temp_entity) | float < min_soil_temp }}
    id: soil_temp_min

  - trigger: template
    value_template: >-
      {{ soil_temp_enabled and soil_temp_entity != ''
         and is_number(states(soil_temp_entity))
         and states(soil_temp_entity) | float > max_soil_temp }}
    id: soil_temp_max

  # Air temperature
  - trigger: template
    value_template: >-
      {{ air_temp_enabled and air_temp_entity != ''
         and is_number(states(air_temp_entity))
         and states(air_temp_entity) | float < min_air_temp }}
    id: air_temp_min

  - trigger: template
    value_template: >-
      {{ air_temp_enabled and air_temp_entity != ''
         and is_number(states(air_temp_entity))
         and states(air_temp_entity) | float > max_air_temp }}
    id: air_temp_max

  # Air humidity
  - trigger: template
    value_template: >-
      {{ air_humidity_enabled and air_humidity_entity != ''
         and is_number(states(air_humidity_entity))
         and states(air_humidity_entity) | float < min_air_humidity }}
    id: air_humidity_min

  - trigger: template
    value_template: >-
      {{ air_humidity_enabled and air_humidity_entity != ''
         and is_number(states(air_humidity_entity))
         and states(air_humidity_entity) | float > max_air_humidity }}
    id: air_humidity_max

  # Light intensity
  - trigger: template
    value_template: >-
      {{ light_enabled and light_entity != ''
         and is_number(states(light_entity))
         and states(light_entity) | float < min_light }}
    id: light_min

  - trigger: template
    value_template: >-
      {{ light_enabled and light_entity != ''
         and is_number(states(light_entity))
         and states(light_entity) | float > max_light }}
    id: light_max

  # UV index
  - trigger: template
    value_template: >-
      {{ uv_enabled and uv_entity != ''
         and is_number(states(uv_entity))
         and states(uv_entity) | float > max_uv }}
    id: uv_max

  # Battery (PLT-1B only)
  - trigger: template
    value_template: >-
      {{ battery_enabled and battery_entity != ''
         and is_number(states(battery_entity))
         and states(battery_entity) | float < min_battery }}
    id: battery_min

  # LED state sync. The template triggers above only fire on a false-to-true
  # transition, so a threshold that is already breached when the automation
  # loads would leave the LED dark until the next repeat. These triggers
  # re-check the LED (and only the LED) after a restart or reload.
  - trigger: homeassistant
    event: start
    id: led_sync
  - trigger: event
    event_type: automation_reloaded
    id: led_sync

conditions:
  - condition: template
    value_template: "{{ not disable_repeat or (trigger.id | default('manual')) != 'time' }}"

action:
  # Apply calibration voltages to device. Skipped for led_sync, which fires on
  # every automation reload system-wide. A sleeping device rejects these calls,
  # so they must never abort the rest of the run.
  - if:
      - condition: template
        value_template: "{{ dry_voltage_entity != '' and (trigger.id | default('manual')) != 'led_sync' }}"
    then:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "{{ dry_voltage_entity }}"
        data:
          value: "{{ dry_voltage_value }}"
  - if:
      - condition: template
        value_template: "{{ wet_voltage_entity != '' and (trigger.id | default('manual')) != 'led_sync' }}"
    then:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "{{ wet_voltage_entity }}"
        data:
          value: "{{ wet_voltage_value }}"

  # Low soil moisture still drives the RGB LED here. The notification itself
  # is sent by the combined alert at the end of this action list.
  - alias: Soil Moisture Low LED
    if:
      - condition: template
        value_template: >-
          {{ soil_moisture_enabled and soil_moisture_entity != ''
             and is_number(states(soil_moisture_entity))
             and states(soil_moisture_entity) | float < min_soil_moisture
             and (trigger.id | default('manual')) in ['time', 'manual', 'soil_moisture_min'] }}
    then:
      - alias: Light the RGB LED
        if:
          - condition: template
            value_template: "{{ led_mode != 'off' and rgb_light_entity != '' }}"
        then:
          # The device may be asleep, so a failed call must not skip the custom action.
          # The data dict is rendered as one template so the Solid option's
          # 'None' effect survives as a string instead of becoming Python None.
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ rgb_light_entity }}"
            data: >-
              {{ dict(rgb_color=led_color, brightness_pct=led_brightness,
                      effect=led_effect) }}
          - if:
              - condition: template
                value_template: "{{ led_mode == 'flash' }}"
            then:
              - delay:
                  seconds: "{{ led_flash_duration }}"
              - action: light.turn_off
                continue_on_error: true
                target:
                  entity_id: "{{ rgb_light_entity }}"

  # RGB LED: clear once the plant has been watered
  - alias: RGB LED Clear
    if:
      - condition: template
        value_template: >-
          {{ led_mode == 'hold' and rgb_light_entity != ''
             and soil_moisture_enabled and soil_moisture_entity != ''
             and is_number(states(soil_moisture_entity))
             and states(soil_moisture_entity) | float >= min_soil_moisture
             and states(rgb_light_entity) == 'on'
             and (trigger.id | default('manual'))
             in ['time', 'manual', 'soil_moisture_ok', 'led_sync'] }}
    then:
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id: "{{ rgb_light_entity }}"

  # RGB LED: restore the correct LED state after a restart or reload. The
  # template triggers only fire on a transition, so without this a threshold
  # that is already breached when the automation loads never lights the LED.
  # Notifications and the custom action deliberately do not run here.
  - alias: RGB LED Sync
    if:
      - condition: template
        value_template: >-
          {{ (trigger.id | default('manual')) in ['led_sync', 'manual']
             and led_mode != 'off' and rgb_light_entity != ''
             and soil_moisture_enabled and soil_moisture_entity != '' }}
    then:
      - choose:
          # Hold mode is a state indicator, so it must relight to match reality
          - conditions:
              - condition: template
                value_template: >-
                  {{ led_mode == 'hold'
                     and is_number(states(soil_moisture_entity))
                     and states(soil_moisture_entity) | float < min_soil_moisture }}
            sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ rgb_light_entity }}"
                data: >-
                  {{ dict(rgb_color=led_color, brightness_pct=led_brightness,
                          effect=led_effect) }}
          # A sync must never start a flash: automation_reloaded fires on every
          # automation save system-wide. An LED on in flash mode is a leftover
          # from an interrupted flash, so clear it.
          - conditions:
              - condition: template
                value_template: >-
                  {{ led_mode == 'flash' and states(rgb_light_entity) == 'on' }}
            sequence:
              - action: light.turn_off
                continue_on_error: true
                target:
                  entity_id: "{{ rgb_light_entity }}"

  # Combined alert: every threshold that is currently out of range lands in
  # one notification, one line per condition. A single breach keeps its
  # specific title; multiple breaches share a summary title. The stable tag
  # in device_message_data makes each repeat replace the previous
  # notification on the phone instead of stacking a new one. led_sync runs
  # only resync the LED and never notify.
  - alias: Combined Alert
    if:
      - condition: template
        value_template: >-
          {{ breaches | count > 0
             and (trigger.id | default('manual'))
                 not in ['led_sync', 'soil_moisture_ok'] }}
    then:
      - if:
          - condition: template
            value_template: "{{ notify_device is not none and notify_device != '' }}"
        then:
          - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
            continue_on_error: true
            data:
              title: >-
                {%- if breaches | count == 1 -%}
                  {{ plant_name }} — {{ breaches[0].title }}
                {%- else -%}
                  {{ plant_name }} needs attention
                {%- endif -%}
              message: >-
                {{ breaches | map(attribute='message') | join('\n') }}
              data: "{{ device_message_data }}"
      - choose: []
        default: !input custom_action

mode: parallel
max: 10
